<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside Out Journal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
        
        /* 極深邃夢幻宇宙藍背景 */
        .cosmic-bg {
            background: radial-gradient(circle at 50% 20%, #0c1c3c 0%, #060b18 50%, #02040a 100%);
            min-height: 100vh;
        }

        /* 弧形不規則夢幻記憶架管道 */
        .curved-shelf-track {
            position: relative;
            background: linear-gradient(90deg, rgba(15,28,60,0.9), rgba(24,43,88,0.95), rgba(15,28,60,0.9));
            border-radius: 9999px;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.9), 0 0 30px rgba(56,189,248,0.15);
            border: 2px solid rgba(56, 189, 248, 0.3);
            padding: 28px 40px;
            margin: 30px 0;
            display: flex;
            gap: 48px;
            overflow-x: auto;
            align-items: center;
        }

        /* 記憶球高低錯落位移，營造夢幻立體感 */
        .memory-item:nth-child(even) { transform: translateY(-16px); }
        .memory-item:nth-child(odd) { transform: translateY(16px); }
        .memory-item:nth-child(3n) { transform: translateY(-8px); }

        /* 🔮 超夢幻立體半透明水晶球 */
        .memory-sphere {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            box-shadow: inset -10px -10px 22px rgba(0,0,0,0.8), inset 10px 10px 22px rgba(255,255,255,0.7), 0 12px 30px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
            flex-shrink: 0;
        }
        .memory-sphere:hover { transform: scale(1.15) translateY(-8px); filter: brightness(1.25); }

        /* 🌟 核心記憶球金色夢幻光暈 */
        .core-glow {
            box-shadow: inset -10px -10px 22px rgba(0,0,0,0.7), inset 10px 10px 22px rgba(255,255,255,0.9), 0 0 35px #facc15, 0 0 70px rgba(250,204,21,0.6);
            border: 3px solid #fef08a;
            animation: pulse-gold 2s infinite alternate;
        }
        @keyframes pulse-gold {
            0% { box-shadow: inset -10px -10px 22px rgba(0,0,0,0.7), 0 0 25px #facc15; }
            100% { box-shadow: inset -10px -10px 22px rgba(0,0,0,0.7), 0 0 50px #fde047, 0 0 90px rgba(253,224,71,0.8); }
        }

        /* ⚡ 閃回記憶藍電光流動效果 */
        .flashback-effect {
            border: 2px dashed #38bdf8;
            box-shadow: inset -10px -10px 22px rgba(0,0,0,0.8), 0 0 30px rgba(56, 189, 248, 0.8);
        }

        /* ✨ 記憶球飛入軌道動畫 */
        @keyframes flyIntoShelf {
            0% { transform: scale(0.2) translateY(200px); opacity: 0; filter: brightness(3); }
            50% { transform: scale(1.3) translateY(-50px); opacity: 1; filter: brightness(2); }
            100% { transform: scale(1) translateY(0); opacity: 1; filter: brightness(1); }
        }
        .fly-animation {
            animation: flyIntoShelf 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
    </style>
</head>

        const encouragementQuotes = [
            "「哭泣其實沒關係，這代表你正在釋放那些過重的負荷。允許自己脆弱，也是一種強大。」—— 憂憂",

        function renderMemories() {
            const recentEl = document.getElementById('recentShelf');

            memories.forEach((m, index) => {
                const node = createMemoryNode(m);
                // 如果係剛新增嘅第一粒記憶（最新果粒），加上飛入軌道動畫特效
                if (index === 0 && m.isJustAdded) {
                    node.classList.add('fly-animation');
                    delete m.isJustAdded; // 動畫播完一次後清除標記
                }
                allEl.appendChild(node);
            });

            memories.slice(0, 5).forEach((m, index) => {
                const node = createMemoryNode(m);
                if (index === 0 && m.isJustAddedAnim) {
                    node.classList.add('fly-animation');
                    delete m.isJustAddedAnim;
                }
                recentEl.appendChild(node);
            });
        }

        function createMemoryNode(m) {
            const div = document.createElement('div');
            div.className = "memory-item flex flex-col items-center flex-shrink-0 cursor-pointer";
            
            let sphereClass = "memory-sphere ";
            let badge = "";
            if (m.isCore) {
                sphereClass += "core-glow ";
                badge = "🌟";
            } else if (m.isFlashback) {
                sphereClass += "flashback-effect ";
                badge = "⚡";
            }

            let bgGrad = "radial-gradient(circle at 35% 35%, #fde047 0%, #ca8a04 80%)";
            let faceIcon = "😊";
            if (m.emotions.includes("悲傷")) { bgGrad = "radial-gradient(circle at 35% 35%, #38bdf8 0%, #0369a1 80%)"; faceIcon = "😢"; }
            else if (m.emotions.includes("憤怒") || m.emotions.includes("煩躁")) { bgGrad = "radial-gradient(circle at 35% 35%, #f87171 0%, #b91c1c 80%)"; faceIcon = "😡"; }
            else if (m.emotions.includes("緊張") || m.emotions.includes("焦慮") || m.emotions.includes("害怕")) { bgGrad = "radial-gradient(circle at 35% 35%, #c084fc 0%, #6b21a8 80%)"; faceIcon = "😰"; }
            else if (m.emotions.includes("興奮") || m.emotions.includes("自豪")) { bgGrad = "radial-gradient(circle at 35% 35%, #4ade80 0%, #15803d 80%)"; faceIcon = "🤩"; }

            div.innerHTML = `
                <div class="${sphereClass}" style="background: ${bgGrad};">
                    <span class="text-2xl drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">${badge || faceIcon}</span>
                </div>
                <div class="text-center mt-2">
                    <div class="text-xs font-bold text-slate-200 w-24 truncate">${m.title}</div>
                    <div class="text-[10px] text-sky-400/80">${m.date}</div>
                </div>
            `;
            return div;
        }

        function openModal() { document.getElementById('memoryModal').classList.remove('hidden'); document.getElementById('memoryModal').classList.add('flex'); }
        function closeModal() { document.getElementById('memoryModal').classList.add('hidden'); document.getElementById('memoryModal').classList.remove('flex'); }
        function openBackupModal() { document.getElementById('backupModal').classList.remove('hidden'); document.getElementById('backupModal').classList.add('flex'); }
        function closeBackupModal() { document.getElementById('backupModal').classList.add('hidden'); document.getElementById('backupModal').classList.remove('flex'); }
        function closeEncouragement() { document.getElementById('encouragementModal').classList.add('hidden'); document.getElementById('encouragementModal').classList.remove('flex'); }

        function saveMemory(e) {
            e.preventDefault();
            const title = document.getElementById('mTitle').value;
            const date = document.getElementById('mDate').value;
            const trigger = document.getElementById('mTrigger').value;
            const isCore = document.getElementById('mCore').checked;
            const isFlashback = document.getElementById('mFlashback').checked;
            const selectedEmotions = Array.from(document.querySelectorAll('input[name="emotions"]:checked')).map(el => el.value);
            const selectedSomatics = Array.from(document.querySelectorAll('input[name="somatics"]:checked')).map(el => el.value);

            const newMemory = {
                id: Date.now(),
                title, date, trigger,
                emotions: selectedEmotions.length ? selectedEmotions : ["平靜"],
                somatics: selectedSomatics,
                isCore, isFlashback,
                isJustAdded: true,
                isJustAddedAnim: true
            };

            memories.unshift(newMemory);
            renderMemories();
            closeModal();
            document.getElementById('memoryForm').reset();

            // 檢查負面情緒並彈出心靈鼓勵
            const negativeEmotions = ["悲傷", "委屈", "孤獨", "憤怒", "煩躁", "不甘心", "焦慮", "害怕", "緊張"];
            const hasNegative = selectedEmotions.some(e => negativeEmotions.includes(e));

            if (hasNegative) {
                const randomQuote = encouragementQuotes[Math.floor(Math.random() * encouragementQuotes.length)];
                document.getElementById('encouragementText').innerText = randomQuote;
                document.getElementById('encouragementModal').classList.remove('hidden');
                document.getElementById('encouragementModal').classList.add('flex');
            }
        }

        function filterMemories() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = memories.filter(m => m.title.toLowerCase().includes(query) || m.trigger.toLowerCase().includes(query));
            const allEl = document.getElementById('allShelf');
            allEl.innerHTML = '';
            filtered.forEach(m => allEl.appendChild(createMemoryNode(m)));
        }

        function saveSupabaseConfig() {
            alert('Supabase 連接設定已儲存！');
            closeBackupModal();
        }

        renderMemories();
    </script>
</body>
</html>
