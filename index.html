<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside Out 記憶總部</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            overflow-x: hidden; 
            min-height: 100vh;
        }

        /* 深邃夢境星空發光背景 */
        .dream-cosmic-bg {
            background: radial-gradient(circle at 50% 15%, rgba(14, 165, 233, 0.2) 0%, transparent 60%),
                        radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 20% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                        #020617;
            min-height: 100vh;
        }

        /* 🔮 超立體 & 晶瑩清亮玻璃水晶球 */
        .glass-sphere {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.55);
            /* 多層極致 3D 陰影與玻璃高光 */
            box-shadow: 
                inset -5px -5px 12px rgba(0, 0, 0, 0.5),
                inset 5px 5px 15px rgba(255, 255, 255, 0.8),
                inset 0 0 10px rgba(255, 255, 255, 0.3),
                0 8px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin: 0 auto;
        }

        /* 水晶球頂部弧形玻璃弧光 */
        .glass-sphere::before {
            content: '';
            position: absolute;
            top: 6%;
            left: 15%;
            width: 70%;
            height: 35%;
            border-radius: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
        }

        /* 水晶球底部反光 */
        .glass-sphere::after {
            content: '';
            position: absolute;
            bottom: 8%;
            right: 20%;
            width: 35%;
            height: 20%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            filter: blur(2px);
            pointer-events: none;
        }

        @media (min-width: 640px) {
            .glass-sphere {
                width: 86px;
                height: 86px;
            }
        }

        .glass-sphere:hover {
            transform: scale(1.15) translateY(-6px) !important;
            box-shadow: 
                inset -5px -5px 12px rgba(0, 0, 0, 0.4),
                inset 5px 5px 20px rgba(255, 255, 255, 0.95),
                0 12px 30px rgba(56, 189, 248, 0.4);
        }

        /* 相片滿版縮放覆蓋於水晶球內部 */
        .sphere-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            opacity: 0.85;
            mix-blend-mode: overlay;
        }

        /* 🌟 核心記憶金光 */
        .core-glow-sphere {
            box-shadow: inset -5px -5px 12px rgba(0,0,0,0.4), inset 5px 5px 20px rgba(255,255,255,0.9), 0 0 25px rgba(250, 204, 21, 0.7);
            border: 1.5px solid #fef08a;
            animation: core-pulse 2.2s infinite alternate ease-in-out;
        }
        @keyframes core-pulse {
            0% { box-shadow: inset -5px -5px 12px rgba(0,0,0,0.4), 0 0 15px #facc15; }
            100% { box-shadow: inset -5px -5px 12px rgba(0,0,0,0.4), 0 0 35px #fde047, 0 0 50px rgba(253,224,71,0.6); }
        }

        /* ⚡ 閃回記憶藍光 */
        .flashback-sphere {
            border: 1.5px dashed #38bdf8;
            box-shadow: inset -5px -5px 12px rgba(0,0,0,0.5), 0 0 20px rgba(56, 189, 248, 0.7);
        }

        /* ✨ 飛入軌道動畫 */
        @keyframes flyIntoArcTrack {
            0% { transform: scale(0.1) translateY(150px) rotate(-90deg); opacity: 0; filter: brightness(2.5); }
            70% { transform: scale(1.15) translateY(-10px) rotate(5deg); opacity: 1; filter: brightness(1.5); }
            100% { transform: scale(1) translateY(0); opacity: 1; filter: brightness(1); }
        }
        .fly-in-animation {
            animation: flyIntoArcTrack 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
    </style>
</head>
<body class="dream-cosmic-bg flex flex-col min-h-screen">

    <!-- 頂部導航列 -->
    <header class="bg-slate-950/80 backdrop-blur-md border-b border-sky-900/40 px-4 sm:px-6 py-3.5 flex justify-between items-center sticky top-0 z-50 shadow-2xl">
        <div class="flex items-center space-x-2">
            <span class="text-lg sm:text-2xl font-black bg-gradient-to-r from-yellow-300 via-sky-300 to-cyan-300 bg-clip-text text-transparent drop-shadow-[0_2px_10px_rgba(56,189,248,0.4)]">
                Inside Out 記憶總部
            </span>
        </div>
        <div class="flex items-center space-x-2 sm:space-x-4">
            <button onclick="openBackupModal()" class="bg-slate-900/80 hover:bg-slate-800 text-sky-200 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl text-xs sm:text-sm font-medium flex items-center space-x-1.5 border border-sky-900/50 transition shadow-md">
                <i class="ph ph-database text-base text-sky-400"></i>
                <span class="hidden sm:inline">雲端同步 / 備份</span>
                <span class="sm:hidden">備份</span>
            </button>
            <button onclick="openModal()" class="bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-slate-950 px-3 py-1.5 sm:px-5 sm:py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center space-x-1.5 shadow-lg shadow-sky-500/25 transition">
                <i class="ph ph-plus-circle text-base"></i>
                <span>新增記憶</span>
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-8">
        
        <!-- 搜尋欄 -->
        <div class="relative max-w-xl mx-auto">
            <i class="ph ph-magnifying-glass absolute left-4 top-3 text-sky-400 text-lg"></i>
            <input type="text" id="searchInput" oninput="filterMemories()" placeholder="搜尋記憶水晶球標題、觸發事件..." class="w-full bg-slate-950/80 border border-sky-900/60 rounded-2xl pl-11 pr-4 py-2.5 text-xs sm:text-sm text-slate-100 placeholder-sky-400/40 focus:outline-none focus:border-sky-400 shadow-inner">
        </div>

        <!-- 近期記憶 (固定每行5個，網格自動排版) -->
        <section class="space-y-4">
            <h2 class="text-lg sm:text-xl font-bold text-yellow-300 flex items-center space-x-2 drop-shadow-[0_0_8px_rgba(250,204,21,0.3)]">
                <i class="ph ph-sparkle text-yellow-400"></i>
                <span>近期記憶管道 (Recent Shelf)</span>
            </h2>
            <!-- 每行 5 個，電腦/平板固定 5 欄，手機屏智慧排版 -->
            <div id="recentShelf" class="grid grid-cols-3 sm:grid-cols-5 gap-3 sm:gap-6 bg-slate-900/30 border border-sky-900/30 p-4 sm:p-6 rounded-3xl backdrop-blur-sm">
                <!-- 動態載入近期記憶 -->
            </div>
        </section>

        <!-- 所有記憶庫存牆 (固定每行5個，超過直接換行) -->
        <section class="space-y-4">
            <h2 class="text-lg sm:text-xl font-bold text-sky-300 flex items-center space-x-2 drop-shadow-[0_0_8px_rgba(56,189,248,0.3)]">
                <i class="ph ph-globe text-sky-400"></i>
                <span>所有記憶庫存牆 (Core Archives)</span>
            </h2>
            <div id="allShelf" class="grid grid-cols-3 sm:grid-cols-5 gap-3 sm:gap-6 bg-slate-900/30 border border-sky-900/30 p-4 sm:p-6 rounded-3xl backdrop-blur-sm">
                <!-- 動態載入所有記憶 -->
            </div>
        </section>
    </main>

    <!-- 💙 療癒鼓勵彈窗 -->
    <div id="encouragementModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="bg-gradient-to-b from-[#0e2347] to-[#060b18] border border-sky-500/50 rounded-3xl max-w-md w-full p-6 sm:p-8 space-y-6 shadow-[0_0_50px_rgba(56,189,248,0.3)] text-center relative">
            <div class="w-14 h-14 bg-sky-500/20 border border-sky-400 rounded-full flex items-center justify-center mx-auto text-2xl text-sky-300">
                💙
            </div>
            <div class="space-y-2">
                <h3 class="text-lg font-black text-sky-200">大腦總部心靈悄悄話</h3>
                <p id="encouragementText" class="text-xs sm:text-sm text-slate-300 leading-relaxed px-2">
                    「哭泣其實沒關係，這代表你正在釋放那些過重的負荷。允許自己脆弱，也是一種強大。」
                </p>
            </div>
            <button onclick="closeEncouragement()" class="w-full py-2.5 bg-gradient-to-r from-sky-500 to-blue-600 text-slate-950 font-bold rounded-xl text-xs sm:text-sm shadow-lg shadow-sky-500/30 hover:brightness-110 transition">
                收到，多謝憂憂與樂樂！ ✨
            </button>
        </div>
    </div>

    <!-- 新增記憶 Modal -->
    <div id="memoryModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-950 border border-sky-900/60 rounded-3xl max-w-xl w-full p-5 sm:p-6 space-y-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base sm:text-lg font-bold text-sky-200">✨ 建立新記憶水晶球</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="ph ph-x text-xl"></i></button>
            </div>

            <form id="memoryForm" onsubmit="saveMemory(event)" class="space-y-4 text-xs sm:text-sm">
                <div>
                    <label class="block font-medium text-slate-300 mb-1">記憶標題</label>
                    <input type="text" id="mTitle" required placeholder="例如：DSE 放榜當日" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-slate-100 focus:outline-none focus:border-sky-400">
                </div>

                <div>
                    <label class="block font-medium text-slate-300 mb-1">發生日期</label>
                    <input type="date" id="mDate" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-slate-100 focus:outline-none focus:border-sky-400">
                </div>

                <div>
                    <label class="block font-medium text-slate-300 mb-1">觸發事件 / 簡述</label>
                    <textarea id="mTrigger" rows="2" placeholder="發生咗咩事令你有呢種感覺..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-slate-100 focus:outline-none focus:border-sky-400"></textarea>
                </div>

                <!-- 📷 上傳相片 Preview -->
                <div>
                    <label class="block font-medium text-slate-300 mb-1">📷 記憶相片 (映照於水晶球內部)</label>
                    <input type="file" id="mPhoto" accept="image/*" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-300 file:mr-3 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-sky-500 file:text-slate-950 hover:file:bg-sky-400">
                </div>

                <!-- 擴充後的情緒分類表單 -->
                <div class="space-y-2">
                    <label class="block font-medium text-slate-300">情緒分類與佔比 (多維度細緻辨識)</label>
                    <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-800 space-y-2.5 text-xs">
                        <div>
                            <span class="text-yellow-400 font-bold">💛 喜悅 / 快樂情緒：</span>
                            <div class="flex flex-wrap gap-2 mt-1">
                                <label><input type="checkbox" name="emotions" value="開心"> 開心</label>
                                <label><input type="checkbox" name="emotions" value="快樂"> 快樂</label>
                                <label><input type="checkbox" name="emotions" value="興奮"> 興奮</label>
                                <label><input type="checkbox" name="emotions" value="感恩"> 感恩</label>
                                <label><input type="checkbox" name="emotions" value="滿足"> 滿足</label>
                                <label><input type="checkbox" name="emotions" value="平靜"> 平靜</label>
                                <label><input type="checkbox" name="emotions" value="自豪"> 自豪</label>
                                <label><input type="checkbox" name="emotions" value="樂觀"> 樂觀</label>
                                <label><input type="checkbox" name="emotions" value="欣慰"> 欣慰</label>
                                <label><input type="checkbox" name="emotions" value="愉快"> 愉快</label>
                            </div>
                        </div>
                        <div>
                            <span class="text-red-400 font-bold">🔴 憤怒 / 憤怒情緒：</span>
                            <div class="flex flex-wrap gap-2 mt-1">
                                <label><input type="checkbox" name="emotions" value="生氣"> 生氣</label>
                                <label><input type="checkbox" name="emotions" value="震怒"> 震怒</label>
                                <label><input type="checkbox" name="emotions" value="憤怒"> 憤怒</label>
                                <label><input type="checkbox" name="emotions" value="憎恨"> 憎恨</label>
                                <label><input type="checkbox" name="emotions" value="不耐"> 不耐</label>
                                <label><input type="checkbox" name="emotions" value="煩躁"> 煩躁</label>
                                <label><input type="checkbox" name="emotions" value="不公平"> 不公平</label>
                                <label><input type="checkbox" name="emotions" value="受冒犯"> 受冒犯</label>
                                <label><input type="checkbox" name="emotions" value="受威脅"> 受威脅</label>
                                <label><input type="checkbox" name="emotions" value="受抨擊"> 受抨擊</label>
                                <label><input type="checkbox" name="emotions" value="受傷害"> 受傷害</label>
                                <label><input type="checkbox" name="emotions" value="不甘心"> 不甘心</label>
                            </div>
                        </div>
                        <div>
                            <span class="text-sky-400 font-bold">💙 哀傷 / 悲傷情緒：</span>
                            <div class="flex flex-wrap gap-2 mt-1">
                                <label><input type="checkbox" name="emotions" value="難過"> 難過</label>
                                <label><input type="checkbox" name="emotions" value="悲傷"> 悲傷</label>
                                <label><input type="checkbox" name="emotions" value="傷心"> 傷心</label>
                                <label><input type="checkbox" name="emotions" value="失望"> 失望</label>
                                <label><input type="checkbox" name="emotions" value="孤單"> 孤單</label>
                                <label><input type="checkbox" name="emotions" value="內疚"> 內疚</label>
                                <label><input type="checkbox" name="emotions" value="疲累"> 疲累</label>
                                <label><input type="checkbox" name="emotions" value="迷失"> 迷失</label>
                                <label><input type="checkbox" name="emotions" value="沮喪"> 沮喪</label>
                                <label><input type="checkbox" name="emotions" value="委屈"> 委屈</label>
                                <label><input type="checkbox" name="emotions" value="失落"> 失落</label>
                            </div>
                        </div>
                        <div>
                            <span class="text-purple-400 font-bold">🟣 懼怕 / 恐懼與焦慮情緒：</span>
                            <div class="flex flex-wrap gap-2 mt-1">
                                <label><input type="checkbox" name="emotions" value="驚慌"> 驚慌</label>
                                <label><input type="checkbox" name="emotions" value="緊張"> 緊張</label>
                                <label><input type="checkbox" name="emotions" value="擔憂"> 擔憂</label>
                                <label><input type="checkbox" name="emotions" value="不安"> 不安</label>
                                <label><input type="checkbox" name="emotions" value="焦慮"> 焦慮</label>
                                <label><input type="checkbox" name="emotions" value="震慄"> 震慄</label>
                                <label><input type="checkbox" name="emotions" value="不知所措"> 不知所措</label>
                                <label><input type="checkbox" name="emotions" value="害怕"> 害怕</label>
                                <label><input type="checkbox" name="emotions" value="恐懼"> 恐懼</label>
                            </div>
                        </div>
                        <div>
                            <span class="text-violet-400 font-bold">🔮 驚訝情緒：</span>
                            <div class="flex flex-wrap gap-2 mt-1">
                                <label><input type="checkbox" name="emotions" value="錯愕"> 錯愕</label>
                                <label><input type="checkbox" name="emotions" value="震驚"> 震驚</label>
                                <label><input type="checkbox" name="emotions" value="驚喜"> 驚喜</label>
                                <label><input type="checkbox" name="emotions" value="意外"> 意外</label>
                            </div>
                        </div>
                        <div>
                            <span class="text-emerald-400 font-bold">💚 厭惡情緒：</span>
                            <div class="flex flex-wrap gap-2 mt-1">
                                <label><input type="checkbox" name="emotions" value="厭惡"> 厭惡</label>
                                <label><input type="checkbox" name="emotions" value="反感"> 反感</label>
                                <label><input type="checkbox" name="emotions" value="排斥"> 排斥</label>
                                <label><input type="checkbox" name="emotions" value="厭倦"> 厭倦</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 🔄 全新擴充：多維度身心互動循環與身體反應 -->
                <div class="space-y-2">
                    <label class="block font-medium text-sky-300">🔄 全方位身心互動循環與身體反應 (軀體感知)</label>
                    <div class="bg-slate-900 p-3.5 rounded-xl border border-sky-900/40 space-y-2.5 text-[11px] sm:text-xs">
                        <div>
                            <span class="text-pink-300 font-bold">👤 頭部與面部反應：</span>
                            <div class="flex flex-wrap gap-1.5 mt-1">
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="面帶微笑"> 面帶微笑</label>
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="頭痛/太陽穴發緊"> 頭痛/太陽穴發緊</label>
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="眼眶發熱"> 眼眶發熱</label>
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="咬緊牙關"> 咬緊牙關</label>
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="面部潮紅"> 面部潮紅</label>
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="頭暈目眩"> 頭暈目眩</label>
                            </div>
                        </div>
                        <div>
                            <span class="text-sky-300 font-bold">🫁 胸腔與呼吸反應：</span>
                            <div class="flex flex-wrap gap-1.5 mt-1">
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="呼吸平穩"> 呼吸平穩</label>
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="胸悶壓迫感"> 胸悶壓迫感</label>
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="心跳加速/心悸"> 心跳加速/心悸</label>
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="喉嚨發緊/梗塞感"> 喉嚨發緊/梗塞感</label>
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="呼吸急促"> 呼吸急促</label>
                            </div>
                        </div>
                        <div>
                            <span class="text-amber-300 font-bold">🥣 胃部與消化反應：</span>
                            <div class="flex flex-wrap gap-1.5 mt-1">
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="胃部翻騰/不適"> 胃部翻騰/不適</label>
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="腸胃抽搐"> 腸胃抽搐</label>
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="食慾不振"> 食慾不振</label>
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="口乾舌燥"> 口乾舌燥</label>
                            </div>
                        </div>
                        <div>
                            <span class="text-purple-300 font-bold">💪 肌肉與四肢反應：</span>
                            <div class="flex flex-wrap gap-1.5 mt-1">
                                <label class="px-2 py-0.5 bg-slate-800 rounded cursor-pointer"><input type="checkbox" name="somatics" value="全身放鬆"> 全身放鬆</label>

    <script>
        let memories = [
            { id: 1, title: "DSE 放榜當日", date: "2026-10-14", trigger: "考到期望分數，與同學拍照道別。", emotions: ["開心", "悲傷"], somatics: ["心跳加速/心悸", "面帶微笑"], photo: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=200", isCore: true, isFlashback: false },

            { id: 5, title: "工作專案獲得讚賞", date: "2026-09-15", trigger: "連續加班兩星期後簡報成功。", emotions: ["感恩", "自豪"], somatics: ["面帶微笑", "頭腦特別清晰"], photo: null, isCore: true, isFlashback: false },
            { id: 6, title: "地鐵被無禮推撞", date: "2026-09-10", trigger: "上班高峰期被硬擠。", emotions: ["憤怒", "受冒犯"], somatics: ["咬緊牙關", "握緊拳頭"], photo: null, isCore: false, isFlashback: false },
            { id: 7, title: "颱風天在家喝熱可可", date: "2026-08-20", trigger: "出面狂風暴雨，躲在被窩看電影。", emotions: ["平靜", "滿足"], somatics: ["呼吸平穩", "全身放鬆"], photo: "https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=200", isCore: false, isFlashback: false },
            { id: 8, title: "公開演講前 5 分鐘", date: "2026-08-05", trigger: "站在舞台側幕等候上台。", emotions: ["緊張", "擔憂"], somatics: ["手心發汗", "肩膀緊繃"], photo: null, isCore: false, isFlashback: false },

            { id: 10, title: "深夜想起舊廣播歌", date: "2026-07-15", trigger: "深夜聽歌突然想起舊時光。", emotions: ["悲傷", "開心"], somatics: ["眼眶發熱"], photo: null, isCore: false, isFlashback: true },
            { id: 11, title: "搶到演唱會門票", date: "2026-06-30", trigger: "倒數搶票成功的一刻。", emotions: ["驚喜", "興奮"], somatics: ["心跳加速/心悸"], photo: null, isCore: false, isFlashback: false },
            { id: 12, title: "發現牛奶過期結塊", date: "2026-06-18", trigger: "剛倒入咖啡發現變質。", emotions: ["厭惡", "煩躁"], somatics: ["面部潮紅"], photo: null, isCore: false, isFlashback: false },
            { id: 13, title: "完成 10K 馬拉松", date: "2026-06-01", trigger: "衝過終點線領完獎牌。", emotions: ["自豪", "滿足"], somatics: ["身體發熱", "心跳加速/心悸"], photo: null, isCore: true, isFlashback: false },
            { id: 14, title: "簡報講錯重要數據", date: "2026-05-20", trigger: "台下全場突然安靜。", emotions: ["驚慌", "不知所措"], somatics: ["喉嚨發緊/梗塞感", "手心發汗"], photo: null, isCore: false, isFlashback: false },
            { id: 15, title: "週五下班離辦公室", date: "2026-05-10", trigger: "打卡離場迎接週末。", emotions: ["平靜", "樂觀"], somatics: ["呼吸平穩", "全身放鬆"], photo: null, isCore: false, isFlashback: false },
            { id: 16, title: "童年玩伴結婚喜帖", date: "2026-04-25", trigger: "收到喜帖想起小時候爬樹。", emotions: ["開心", "悲傷"], somatics: ["眼眶發熱", "面帶微笑"], photo: null, isCore: false, isFlashback: true },
            { id: 17, title: "衝動消費買貴衣物", date: "2026-04-12", trigger: "回家試穿覺得不合適。", emotions: ["內疚", "失望"], somatics: ["胃部翻騰/不適"], photo: null, isCore: false, isFlashback: false },
            { id: 18, title: "正念禪修靜坐 20 分鐘", date: "2026-03-30", trigger: "專注呼吸雜念沉澱。", emotions: ["平靜"], somatics: ["呼吸平穩", "頭腦特別清晰", "全身放鬆"], photo: null, isCore: false, isFlashback: false },
            { id: 19, title: "搬離住十年舊居", date: "2026-03-15", trigger: "最後一次鎖上舊家大門。", emotions: ["迷失", "興奮"], somatics: ["胸悶壓迫感", "全身無力感"], photo: null, isCore: true, isFlashback: false },
            { id: 20, title: "小學被罰站回憶", date: "2026-03-01", trigger: "路過母校想起當年蝦碌事。", emotions: ["不安", "煩躁"], somatics: ["肩膀緊繃"], photo: null, isCore: false, isFlashback: true }
        ];

        const encouragementQuotes = [
            "「哭泣其實沒關係，這代表你正在釋放那些過重的負荷。允許自己脆弱，也是一種強大。」—— 憂憂",
            "「當你感到憤怒或煩躁時，記得深呼吸。你的情緒在提醒你：某些界限需要被守護。」—— 怒怒",
            "「焦慮與害怕是為了保護你免受傷害。摸摸胸口告訴自己：現在很安全，我們一起面對。」—— 驚驚",
            "「即使今天烏雲密布，每一種情緒的存在都是為了讓你更完整。你做得很好！」—— 樂樂"
        ];

        function renderMemories() {
            const recentEl = document.getElementById('recentShelf');
            const allEl = document.getElementById('allShelf');
            recentEl.innerHTML = '';
            allEl.innerHTML = '';

            memories.forEach((m, index) => {
                const node = createMemoryNode(m);
                if (index === 0 && m.isJustAdded) {
                    node.classList.add('fly-in-animation');
                    delete m.isJustAdded;
                }
                allEl.appendChild(node);
            });

            memories.slice(0, 5).forEach((m, index) => {
                const node = createMemoryNode(m);
                if (index === 0 && m.isJustAddedAnim) {
                    node.classList.add('fly-in-animation');
                    delete m.isJustAddedAnim;
                }
                recentEl.appendChild(node);
            });
        }

        function createMemoryNode(m) {
            const div = document.createElement('div');
            div.className = "memory-item flex flex-col items-center justify-center cursor-pointer p-1";
            
            let sphereClass = "glass-sphere ";
            let badge = "";
            if (m.isCore) {
                sphereClass += "core-glow-sphere ";
                badge = "🌟";
            } else if (m.isFlashback) {
                sphereClass += "flashback-sphere ";
                badge = "⚡";
            }

            /* ✨ 調低飽和度與濃度，呈現清亮透明感色彩 */
            let bgGrad = "radial-gradient(circle at 30% 30%, rgba(254,240,138,0.55) 0%, rgba(234,179,8,0.3) 100%)";
            let faceIcon = "😊";
            
            if (m.emotions.some(e => ["悲傷", "難過", "傷心", "失望", "孤單", "內疚", "疲累", "迷失", "沮喪", "委屈", "失落"].includes(e))) { 
                bgGrad = "radial-gradient(circle at 30% 30%, rgba(186,230,253,0.6) 0%, rgba(14,165,233,0.35) 100%)"; faceIcon = "😢"; 
            }
            else if (m.emotions.some(e => ["生氣", "震怒", "憤怒", "憎恨", "不耐", "煩躁", "不公平", "受冒犯", "受威脅", "受抨擊", "受傷害", "不甘心"].includes(e))) { 
                bgGrad = "radial-gradient(circle at 30% 30%, rgba(254,202,202,0.6) 0%, rgba(239,68,68,0.35) 100%)"; faceIcon = "😡"; 
            }
            else if (m.emotions.some(e => ["驚慌", "緊張", "擔憂", "不安", "焦慮", "震慄", "不知所措", "害怕", "恐懼"].includes(e))) { 
                bgGrad = "radial-gradient(circle at 30% 30%, rgba(233,213,255,0.6) 0%, rgba(168,85,247,0.35) 100%)"; faceIcon = "😰"; 
            }
            else if (m.emotions.some(e => ["錯愕", "震驚", "驚喜", "意外"].includes(e))) { 
                bgGrad = "radial-gradient(circle at 30% 30%, rgba(221,214,254,0.6) 0%, rgba(139,92,246,0.35) 100%)"; faceIcon = "😲"; 
            }
            else if (m.emotions.some(e => ["厭惡", "反感", "排斥", "厭倦"].includes(e))) { 
                bgGrad = "radial-gradient(circle at 30% 30%, rgba(187,247,208,0.6) 0%, rgba(34,197,94,0.35) 100%)"; faceIcon = "🤢"; 
            }

            let innerContent = m.photo ? `<img src="${m.photo}" class="sphere-photo">` : `<span class="text-xl sm:text-2xl drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">${badge || faceIcon}</span>`;

            div.innerHTML = `
                <div class="${sphereClass}" style="background: ${bgGrad};">
                    ${innerContent}
                </div>
                <div class="text-center mt-2 w-full px-1">
                    <div class="text-[11px] sm:text-xs font-bold text-slate-200 truncate">${m.title}</div>
                    <div class="text-[9px] sm:text-[10px] text-sky-400/80 mt-0.5">${m.date}</div>
                </div>
            `;
            return div;
        }

        function openModal() { document.getElementById('memoryModal').classList.remove('hidden'); document.getElementById('memoryModal').classList.add('flex'); }
        function closeModal() { document.getElementById('memoryModal').classList.add('hidden'); document.getElementById('memoryModal').classList.remove('flex'); }
        function openBackupModal() { document.getElementById('backupModal').classList.remove('hidden'); document.getElementById('backupModal').classList.add('flex'); }
        function closeBackupModal() { document.getElementById('backupModal').classList.add('hidden'); document.getElementById('backupModal').classList.remove('flex'); }
        function closeEncouragement() { document.getElementById('encouragementModal').classList.add('hidden'); document.getElementById('encouragementModal').classList.remove('flex'); }

        function saveMemory(e) {
            e.preventDefault();
            const title = document.getElementById('mTitle').value;
            const date = document.getElementById('mDate').value;
            const trigger = document.getElementById('mTrigger').value;
            const isCore = document.getElementById('mCore').checked;
            const isFlashback = document.getElementById('mFlashback').checked;
            const selectedEmotions = Array.from(document.querySelectorAll('input[name="emotions"]:checked')).map(el => el.value);
            const selectedSomatics = Array.from(document.querySelectorAll('input[name="somatics"]:checked')).map(el => el.value);
            const photoFile = document.getElementById('mPhoto').files[0];

            let photoUrl = null;
            if (photoFile) {
                photoUrl = URL.createObjectURL(photoFile);
            }

            const newMemory = {
                id: Date.now(),
                title, date, trigger,
                emotions: selectedEmotions.length ? selectedEmotions : ["平靜"],
                somatics: selectedSomatics,
                photo: photoUrl,
                isCore, isFlashback,
                isJustAdded: true,
                isJustAddedAnim: true
            };

            memories.unshift(newMemory);
            renderMemories();
            closeModal();
            document.getElementById('memoryForm').reset();

            const negativeEmotions = ["生氣", "震怒", "憤怒", "憎恨", "不耐", "煩躁", "不公平", "受冒犯", "受威脅", "受抨擊", "受傷害", "不甘心", "難過", "悲傷", "傷心", "失望", "孤單", "內疚", "疲累", "迷失", "沮喪", "委屈", "失落", "驚慌", "緊張", "擔憂", "不安", "焦慮", "震慄", "不知所措", "害怕", "恐懼", "厭惡", "反感", "排斥", "厭倦"];
            if (selectedEmotions.some(e => negativeEmotions.includes(e))) {
                const randomQuote = encouragementQuotes[Math.floor(Math.random() * encouragementQuotes.length)];
                document.getElementById('encouragementText').innerText = randomQuote;
                document.getElementById('encouragementModal').classList.remove('hidden');
                document.getElementById('encouragementModal').classList.add('flex');
            }
        }

        function filterMemories() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = memories.filter(m => m.title.toLowerCase().includes(query) || m.trigger.toLowerCase().includes(query));
            const allEl = document.getElementById('allShelf');
            allEl.innerHTML = '';
            filtered.forEach(m => allEl.appendChild(createMemoryNode(m)));
        }

        function saveSupabaseConfig() {
            alert('Supabase 連接設定已儲存！');
            closeBackupModal();
        }

        renderMemories();
    </script>
